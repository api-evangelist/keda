aid: keda
name: KEDA
description: >-
  KEDA (Kubernetes Event Driven Autoscaling) is an application autoscaler that
  drives scaling of any container in Kubernetes based on the number of events
  needing to be processed. It is a CNCF project.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
