specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: KEDA
providerId: keda
publisherName: KEDA - CNCF
serviceCategory: Open-Source Kubernetes Autoscaling
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Autoscaling
  - CNCF
  - Event-Driven
  - Kubernetes
  - FinOps
  - FOCUS
  - Open Source
description: FOCUS-aligned FinOps scaffold for KEDA. KEDA itself has no project fees; its
  FinOps relevance is as a cost-optimization lever - it scales workloads to zero and back
  on event volume, directly reducing underlying-Kubernetes spend.
sources:
  - https://keda.sh/
  - https://keda.sh/docs/latest/
  - https://www.finops.org/framework/
  - https://focus.finops.org/focus-specification/v1-3/
billingModel:
  pricingCategory: Open Source (no project fees)
  billingFrequency: Not Applicable
  billingCurrency: USD
  chargeCategories:
    - Usage
focusColumns:
  ServiceName: KEDA
  ServiceCategory: Open-Source Kubernetes Autoscaling
  ProviderName: KEDA - CNCF
  PublisherName: KEDA - CNCF
  InvoiceIssuerName: Not Applicable (open source)
  BillingCurrency: USD
meters:
  - name: scaledobject_count
    unit: scaledobject
    aggregation: max
    dimensions:
      - namespace
      - cluster
  - name: scaler_polls
    unit: poll
    aggregation: sum
    dimensions:
      - scaler
      - scaledobject
      - namespace
  - name: scaling_events
    unit: event
    aggregation: sum
    dimensions:
      - scaledobject
      - direction
principles:
  - name: Visibility
    description: KEDA exports Prometheus metrics (keda_scaler_metrics_value, keda_scaled_object_paused,
      keda_scaler_errors_total) and emits CloudEvents (ScaledObjectReady, ScalerError); pipe
      both into the cluster monitoring stack to see scaling behavior.
  - name: Allocation
    description: KEDA itself is not billed. Allocate the spend it influences by namespace /
      workload and tie scaling events to the workload owner via labels.
  - name: Optimization
    description: KEDA is itself an optimization lever - scale-to-zero on idle queues, tune
      pollingInterval / cooldownPeriod, and use the Multiple-Triggers pattern to scale on
      the most cost-relevant signal.
  - name: Accountability
    description: Platform team owns the KEDA install; workload owners are accountable for
      their ScaledObject definitions and the resulting cluster spend.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
