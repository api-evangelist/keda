specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: KEDA
providerId: keda
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Autoscaling
  - CNCF
  - Event-Driven
  - Graduated
  - Kubernetes
description: KEDA (Kubernetes Event-Driven Autoscaling) is a CNCF graduated open-source
  project distributed under the Apache 2.0 license. The KEDA project itself has no
  pricing - it is installed into a user's own Kubernetes cluster. Cost arises from the
  underlying Kubernetes nodes / managed-Kubernetes service and from the event sources KEDA
  scales from (Kafka, RabbitMQ, AWS SQS, Azure Service Bus, Prometheus, etc.).
sources:
  - https://keda.sh/
  - https://keda.sh/docs/latest/
  - https://github.com/kedacore/keda/blob/main/LICENSE
plans:
  - id: keda-open-source
    name: Open Source
    type: freemium
    description: KEDA is free to install and run under Apache 2.0. No license fees and no
      per-call quotas imposed by the project. The KEDA Metrics API runs in-cluster as a
      Kubernetes external-metrics provider; no external rate limits are charged.
    entries:
      - label: Software License
        name: software_license
        type: flat
        metric: license
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Apache 2.0 License
      - name: Self-hosted in user-owned Kubernetes cluster
      - name: CNCF Graduated project (community-maintained)
      - name: Community support via Slack, GitHub, Stack Overflow
      - name: Optional commercial support from third-party Kubernetes vendors
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
