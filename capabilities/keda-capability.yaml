naftiko: 1.0.0-alpha2
info:
  label: KEDA Metrics API
  description: KEDA's Metrics API scaler connects to an HTTP endpoint that exposes a numeric metric value, which KEDA uses
    to drive scaling decisions. The endpoint must return a JSON, Prometheus, XML, or YAML response containing a metric value
    at a configured path. KEDA polls the endpoint on a configurable interval and compares the extracted value against a threshold
    to determine the desired replica count for the target workload. This specification describes the interface that an external
    HTTP metrics endpoint must implement to be compatible with the KEDA Metrics API scaler.
  tags:
  - Keda
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: keda
    baseUri: http://metrics-api:8080
    description: KEDA Metrics API HTTP API.
    authentication:
      type: bearer
      token: '{{KEDA_TOKEN}}'
    resources:
    - name: metricpath
      path: /{metricPath}
      operations:
      - name: getmetricvalue
        method: GET
        description: KEDA Get metric value
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: keda-rest
    description: REST adapter for KEDA Metrics API.
    resources:
    - path: /{metricPath}
      name: getmetricvalue
      operations:
      - method: GET
        name: getmetricvalue
        description: KEDA Get metric value
        call: keda.getmetricvalue
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: keda-mcp
    transport: http
    description: MCP adapter for KEDA Metrics API for AI agent use.
    tools:
    - name: getmetricvalue
      description: KEDA Get metric value
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: keda.getmetricvalue
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    KEDA_TOKEN: KEDA_TOKEN
